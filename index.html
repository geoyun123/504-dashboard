<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼓山高中504｜定期評量儀表板</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fffaf5;
  color: #554b47;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
               "Microsoft JhengHei", sans-serif;
}

header {
  background: linear-gradient(90deg, #e99272, #efaa80);
  color: white;
  padding: 15px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 1px;
}

.header-tag {
  background: rgba(255,255,255,.25);
  border: 1px solid rgba(255,255,255,.55);
  padding: 8px 15px;
  border-radius: 20px;
  font-size: 14px;
}

.dashboard {
  max-width: 1500px;
  margin: auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 430px 1fr;
  gap: 22px;
}

.left {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.card {
  background: rgba(255,255,255,.92);
  border: 1px solid #f0e5dc;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(120,90,70,.08);
  padding: 22px;
}

.date {
  text-align: center;
  font-size: 20px;
  color: #7c706a;
}

.clock {
  text-align: center;
  font-size: 68px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #df765a;
  margin: 8px 0;
  font-variant-numeric: tabular-nums;
}

.countdown-title {
  text-align: center;
  color: #b57b34;
  font-size: 17px;
}

.countdown {
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  color: #c78b38;
  margin-top: 6px;
}

.status {
  margin-top: 14px;
  text-align: center;
  background: #fff4df;
  padding: 11px;
  border-radius: 14px;
  color: #9b6d30;
  font-weight: 600;
}

.attendance-title,
.reminder-title,
.seat-title {
  font-size: 21px;
  font-weight: 700;
  color: #d36f57;
  margin-bottom: 16px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.stat {
  background: #fff7f0;
  padding: 12px 4px;
  border-radius: 12px;
  text-align: center;
}

.stat span {
  display: block;
  font-size: 13px;
  color: #8b817b;
}

.stat strong {
  display: block;
  font-size: 26px;
  margin-top: 3px;
}

.reminder {
  background: #fff8dc;
}

.reminder ul {
  margin: 0;
  padding-left: 22px;
  line-height: 1.9;
}

.schedule-card {
  min-height: 400px;
}

.schedule-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.schedule-heading h2 {
  margin: 0;
  color: #5e5550;
  font-size: 25px;
}

.day-label {
  color: #d97a62;
  background: #fff0eb;
  padding: 7px 12px;
  border-radius: 14px;
  font-size: 14px;
}

.schedule-row {
  display: grid;
  grid-template-columns: 180px 1fr 1fr;
  align-items: center;
  min-height: 64px;
  padding: 10px 16px;
  border-bottom: 1px solid #f2ebe5;
  border-left: 5px solid transparent;
  transition: .25s;
}

.schedule-row .time {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 17px;
  font-weight: 600;
}

.schedule-row .subject {
  font-size: 23px;
  color: #c96755;
  font-weight: 600;
}

.schedule-row .note {
  color: #91857f;
  font-size: 15px;
}

.schedule-row.active {
  background: linear-gradient(90deg, #fff3c9, #fff8df);
  border-left-color: #e5a51e;
  border-radius: 8px;
}

.schedule-row.active .subject {
  color: #c97d00;
}

.seat-card {
  margin-top: 22px;
}

.board {
  width: 45%;
  min-width: 240px;
  margin: 4px auto 22px;
  padding: 9px;
  text-align: center;
  border-radius: 8px;
  background: #766c66;
  color: white;
  letter-spacing: 6px;
  font-size: 14px;
}

.seats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.seat {
  border: 1px solid #eadfd6;
  background: #fffdfb;
  border-radius: 12px;
  padding: 13px 4px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: .15s;
}

.seat:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 12px rgba(80,60,50,.1);
}

.seat .num {
  font-size: 17px;
  font-weight: 700;
}

.seat .seat-status {
  margin-top: 4px;
  font-size: 12px;
  color: #999;
}

.seat.absent {
  background: #ffe8e8;
  border-color: #e8a4a4;
}

.seat.absent .seat-status {
  color: #bd5555;
  font-weight: 700;
}

.seat.away {
  background: #e9f1ff;
  border-color: #9fbbe8;
}

.seat.away .seat-status {
  color: #557bbd;
  font-weight: 700;
}

.seat-help {
  margin-top: 15px;
  text-align: center;
  color: #968a83;
  font-size: 13px;
}

footer {
  text-align: center;
  color: #aaa09a;
  font-size: 12px;
  padding: 5px 20px 25px;
}

@media (max-width: 900px) {
  .dashboard {
    grid-template-columns: 1fr;
  }

  .clock {
    font-size: 56px;
  }

  .schedule-row {
    grid-template-columns: 130px 1fr;
  }

  .schedule-row .note {
    display: none;
  }

  .seats {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* 一般教室電腦高度較矮時再壓縮 */

<body>

<header>
  <h1>鼓山高中 504｜第一次定期評量</h1>
  <div class="header-tag">🌻 504 Exam Dashboard</div>
</header>

<main class="dashboard">

  <section class="left">

    <div class="card">
      <div class="date" id="date">日期</div>
      <div class="clock" id="clock">00:00:00</div>

      <div class="countdown-title" id="countdownTitle">
        今日考程
      </div>

      <div class="countdown" id="countdown">
        --:--
      </div>

      <div class="status" id="status">
        🌻 準備今天的考試
      </div>
    </div>

    <div class="card">
      <div class="attendance-title">📋 504 出缺席</div>

      <div class="stats">
        <div class="stat">
          <span>應到</span>
          <strong id="totalCount">30</strong>
        </div>

        <div class="stat">
          <span>實到</span>
          <strong id="presentCount">30</strong>
        </div>

        <div class="stat">
          <span>未到</span>
          <strong id="absentCount">0</strong>
        </div>

        <div class="stat">
          <span>抽離</span>
          <strong id="awayCount">0</strong>
        </div>
      </div>
    </div>

    <div class="card reminder">
      <div class="reminder-title">💌 導師小叮嚀</div>
      <ul>
        <li>鐘響前請收妥課本與個人物品</li>
        <li>記得寫上班級、姓名與座號</li>
        <li>考試結束請立即停筆</li>
      </ul>
    </div>

  </section>


  <section>

    <div class="card schedule-card">

      <div class="schedule-heading">
        <h2>🌻 今日考程</h2>
        <div class="day-label">第 1 天考程</div>
      </div>

      <div id="schedule"></div>

    </div>


    <div class="card seat-card">

      <div class="seat-title">🪑 504 座位表</div>

      <div class="board">黑 板</div>

      <div class="seats" id="seats"></div>

      <div class="seat-help">
        點一下：缺席 ｜ 再點一下：抽離 ｜ 第三次：恢復到班
      </div>

    </div>

  </section>

</main>

<footer>
  鼓山高中 504 班級儀表板
</footer>


<script>

/* ==============================
   今日考程
   之後我們只需要修改這裡
================================ */

const schedule = [
  {
    start: "08:10",
    end: "09:00",
    subject: "國文",
    note: ""
  },
  {
    start: "09:15",
    end: "10:05",
    subject: "英文",
    note: ""
  },
  {
    start: "10:20",
    end: "11:10",
    subject: "數學",
    note: ""
  },
  {
    start: "11:10",
    end: "12:30",
    subject: "午餐、打掃",
    note: ""
  },
  {
    start: "12:30",
    end: "13:10",
    subject: "午休",
    note: ""
  },
  {
    start: "13:20",
    end: "14:10",
    subject: "歷史",
    note: ""
  },
  {
    start: "14:25",
    end: "15:15",
    subject: "地理",
    note: ""
  }
];


/* ==============================
   建立考程
================================ */

function buildSchedule() {

  const box = document.getElementById("schedule");
  box.innerHTML = "";

  schedule.forEach((item, index) => {

    const row = document.createElement("div");
    row.className = "schedule-row";
    row.id = "schedule-" + index;

    row.innerHTML = `
      <div class="time">${item.start} - ${item.end}</div>
      <div class="subject">${item.subject}</div>
      <div class="note">${item.note}</div>
    `;

    box.appendChild(row);
  });
}


/* ==============================
   時間工具
================================ */

function timeToToday(time, now) {

  const [hour, minute] = time.split(":").map(Number);

  const d = new Date(now);

  d.setHours(hour, minute, 0, 0);

  return d;
}


function formatCountdown(ms) {

  if (ms < 0) ms = 0;

  const totalSeconds = Math.floor(ms / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  if (hours > 0) {
    return (
      String(hours).padStart(2, "0") + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0")
    );
  }

  return (
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0")
  );
}


/* ==============================
   更新時鐘與考程狀態
================================ */

function updateClock() {

  const now = new Date();

  const weekdays = [
    "日","一","二","三","四","五","六"
  ];

  document.getElementById("date").textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("zh-TW", {
      hour12: false
    });

  document.querySelectorAll(".schedule-row")
    .forEach(row => row.classList.remove("active"));

  let current = -1;
  let next = -1;

  for (let i = 0; i < schedule.length; i++) {

    const start = timeToToday(schedule[i].start, now);
    const end = timeToToday(schedule[i].end, now);

    if (now >= start && now < end) {
      current = i;
      break;
    }

    if (now < start) {
      next = i;
      break;
    }
  }


  const title = document.getElementById("countdownTitle");
  const countdown = document.getElementById("countdown");
  const status = document.getElementById("status");


  if (current >= 0) {

    const item = schedule[current];

    document
      .getElementById("schedule-" + current)
      .classList.add("active");

    const end = timeToToday(item.end, now);

    title.textContent =
      `【${item.subject}】結束倒數`;

    countdown.textContent =
      formatCountdown(end - now);

    status.textContent =
      `🌻 目前狀態：${item.subject}`;

  }

  else if (next >= 0) {

    const item = schedule[next];
    const start = timeToToday(item.start, now);

    title.textContent =
      `距離【${item.subject}】開始`;

    countdown.textContent =
      formatCountdown(start - now);

    status.textContent =
      `☕ 現在是休息時間`;

  }

  else {

    title.textContent = "今日考程";

    countdown.textContent = "完成";

    status.textContent =
      "🎉 今天的考程結束了";

  }
}


/* ==============================
   建立座位表
================================ */

const TOTAL_STUDENTS = 27;

const seatStates = {};

function buildSeats() {

  const box = document.getElementById("seats");

  for (let i = 1; i <= TOTAL_STUDENTS; i++) {

    seatStates[i] = 0;

    const seat = document.createElement("div");

    seat.className = "seat";
    seat.id = "seat-" + i;

    seat.innerHTML = `
      <div class="num">${String(i).padStart(2,"0")}號</div>
      <div class="seat-status">到班</div>
    `;

    seat.addEventListener("click", () => {
      changeSeat(i);
    });

    box.appendChild(seat);
  }
}


/* 0＝到班、1＝缺席、2＝抽離 */

function changeSeat(number) {

  seatStates[number] =
    (seatStates[number] + 1) % 3;

  const seat =
    document.getElementById("seat-" + number);

  const text =
    seat.querySelector(".seat-status");

  seat.classList.remove("absent", "away");

  if (seatStates[number] === 0) {

    text.textContent = "到班";

  }

  if (seatStates[number] === 1) {

    seat.classList.add("absent");
    text.textContent = "缺席";

  }

  if (seatStates[number] === 2) {

    seat.classList.add("away");
    text.textContent = "抽離";

  }

  updateAttendance();
}


/* ==============================
   自動計算出缺席
================================ */

function updateAttendance() {

  let absent = 0;
  let away = 0;

  Object.values(seatStates).forEach(state => {

    if (state === 1) absent++;

    if (state === 2) away++;

  });

  const present =
    TOTAL_STUDENTS - absent - away;

  document.getElementById("totalCount")
    .textContent = TOTAL_STUDENTS;

  document.getElementById("presentCount")
    .textContent = present;

  document.getElementById("absentCount")
    .textContent = absent;

  document.getElementById("awayCount")
    .textContent = away;
}


/* ==============================
   啟動
================================ */

buildSchedule();
buildSeats();
updateAttendance();
updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
