<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>鼓山高中504｜第一次段考</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f3efe8; --card:#fffdfa; --ink:#302f2d; --muted:#77716b;
  --line:#ded8cf; --dark:#403e3b; --orange:#dc774c; --orange-soft:#f5dfd2;
}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}
header{height:56px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:800}
header h1{font-size:22px;margin:0}.tag{border:1px solid #817d77;border-radius:22px;padding:7px 16px;font-size:14px;font-weight:500}
.dashboard{height:calc(100vh - 56px);padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.left{min-width:0;display:grid;gap:14px;grid-template-rows:270px 1fr}.right{min-width:0;display:grid;grid-template-rows:15% 15% 70%;gap:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.clock-card{padding:18px 22px;text-align:center}.date{font-size:22px;font-weight:700;color:#69645f}.clock{font-size:64px;font-weight:850;letter-spacing:2px;line-height:1.1;margin:8px 0}
.count-label{font-size:19px;font-weight:700;color:#625d58}.countdown{font-size:34px;font-weight:850;color:var(--orange);margin-top:4px}.current{margin-top:10px;padding:10px;border-radius:13px;background:#eee9e1;font-size:17px;font-weight:750}
.schedule{padding:16px 20px;overflow:hidden}.title{font-size:23px;font-weight:850;margin:0 0 12px}.schedule-row{display:grid;grid-template-columns:160px 1fr;align-items:center;min-height:48px;padding:0 12px;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}
.schedule-row:last-child{border-bottom:0}.schedule-row.active{background:var(--orange-soft);border-left:5px solid var(--orange);border-radius:11px;color:#c95d34}.time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}
.top-right{display:contents}.attendance,.reminder{padding:17px 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eee9e1;border-radius:14px;text-align:center;padding:10px 5px}.stat span{display:block;color:#716c66;font-size:14px}.stat strong{display:block;font-size:28px;margin-top:2px}
.absent-list{margin-top:10px;font-size:15px;font-weight:750}.absent-list b{color:var(--orange)}
.reminder ul{margin:8px 0 0;padding-left:23px;font-size:16px;line-height:1.55}
.seat-card{padding:15px 18px;overflow:hidden}.seat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.seat-head .title{margin:0}.legend{font-size:13px;color:var(--muted)}
.board{width:38%;margin:0 auto 9px;background:#5d5955;color:#fff;text-align:center;border-radius:8px;padding:6px;font-size:13px;letter-spacing:8px}
.seats{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:7px;height:calc(100% - 78px)}
.seat{border:1px solid #d9d2c8;border-radius:10px;background:#fbf9f5;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-size:20px;font-weight:850;transition:.15s}
.seat:hover{transform:translateY(-1px);border-color:#bdb4a8}.seat.absent{background:var(--orange-soft);border:2px solid var(--orange);color:#b84f2c}.seat.empty{visibility:hidden;pointer-events:none}
@media(max-width:1000px){body{overflow:auto}.dashboard{height:auto;grid-template-columns:1fr}.left,.right{grid-template-rows:auto}.clock-card{min-height:250px}.schedule{min-height:390px}.top-right{grid-template-columns:1fr}.seat-card{min-height:500px}}

/* ===== 右側整合資訊板 ===== */
.right .card{border:0;border-radius:0;box-shadow:none;background:transparent}
.attendance{grid-row:1;padding:10px 18px;display:grid;grid-template-columns:170px 1fr 210px;align-items:center;gap:14px;border-bottom:1px solid var(--line)!important;background:#fffdfa!important}
.attendance .title{margin:0;font-size:20px;white-space:nowrap}
.attendance .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.attendance .stat{padding:6px 5px;border-radius:12px;background:#f1ece5}
.attendance .stat span{font-size:12px}
.attendance .stat strong{font-size:22px;line-height:1.05}
.attendance .absent-list{margin:0;font-size:14px;white-space:nowrap;background:var(--orange-soft);padding:8px 11px;border-radius:12px}

.reminder{grid-row:2;position:relative;padding:9px 105px 9px 18px;display:grid;grid-template-columns:170px 1fr;align-items:center;gap:12px;border-bottom:1px solid var(--line)!important;background:#faf6ef!important;overflow:hidden}
.reminder .title{margin:0;font-size:20px;white-space:nowrap}
.reminder ul{margin:0;padding-left:20px;display:flex;flex-wrap:wrap;gap:2px 22px;font-size:14px;line-height:1.35}
.reminder li{margin:0}

/* 小熊探頭：純 CSS，不增加圖片檔案大小 */
.reminder:after{content:"";position:absolute;right:26px;bottom:-11px;width:58px;height:58px;background:#d9b58d;border-radius:48% 48% 44% 44%;box-shadow:-22px -15px 0 -13px #d9b58d,22px -15px 0 -13px #d9b58d}
.reminder:before{content:"• ᴥ •";position:absolute;z-index:2;right:32px;bottom:11px;width:46px;text-align:center;color:#51483f;font-size:15px;font-weight:900;letter-spacing:1px}

.seat-card{grid-row:3;padding:12px 18px 14px;min-height:0;background:#fffdfa!important}
.seat-head{margin-bottom:5px}
.seat-head .title{font-size:21px}
.board{width:42%;margin:0 auto 7px;padding:5px;background:#5d5955;box-shadow:0 3px 0 #cbc2b7;position:relative}
.seats{height:calc(100% - 70px);gap:8px}
.seat{font-size:23px;border-radius:11px;background:#fbf9f5}
.seat.absent{background:var(--orange-soft)}

/* 左側也補少量一致的可愛點綴 */
.clock-card{position:relative;overflow:hidden}
.clock-card:after{content:"✦";position:absolute;right:24px;top:20px;color:#dc774c;font-size:24px;opacity:.8}
.schedule .title:after{content:"  ✦";color:#dc774c;font-size:16px}

@media(max-width:1000px){
 .right{display:block;background:transparent;border:0;box-shadow:none;overflow:visible}
 .right .card{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px}
 .attendance,.reminder{display:block;padding:16px}
 .attendance .stats{margin-top:10px}
 .attendance .absent-list{margin-top:10px}
 .reminder ul{display:block;margin-top:8px}
 .seat-card{min-height:520px}
}


/* ===== 本次微調 ===== */
.schedule .title:after{content:""}

/* 出席狀況：與叮嚀同底色，但提高資訊層級 */
.attendance{
  background:#faf6ef!important;
  grid-template-columns:150px 1fr 220px;
  border-bottom:1px solid var(--line)!important;
}
.attendance .title{
  font-size:23px;
  font-weight:900;
  color:#302f2d;
}
.attendance .stats{gap:10px}
.attendance .stat{
  background:#fffdfa;
  border:1px solid #e5ddd2;
  padding:7px 5px;
}
.attendance .stat span{
  font-size:13px;
  font-weight:700;
}
.attendance .stat strong{
  font-size:27px;
  font-weight:900;
}
.attendance .absent-list{
  background:#f3ddcf;
  border:1px solid #ebcbb8;
  font-size:15px;
  font-weight:800;
  padding:10px 12px;
}

/* 導師叮嚀：三點固定三行，與出席狀況同底色 */
.reminder{
  background:#faf6ef!important;
  grid-template-columns:170px 1fr;
  padding:8px 105px 8px 18px;
}
.reminder ul{
  display:grid;
  grid-template-columns:1fr;
  gap:1px;
  margin:0;
  padding-left:20px;
  font-size:14px;
  line-height:1.35;
}
.reminder li{white-space:nowrap}

/* 黑板只保留黑板本體 */
.board:before,.board:after{content:none!important}


/* ===== 25 / 15 / 60 大螢幕微調 ===== */
.right{grid-template-rows:25% 15% 60%}

/* 考程文字放大 */
.schedule .title{font-size:25px;margin-bottom:13px}
.schedule-row{grid-template-columns:175px 1fr;min-height:54px;font-size:23px;padding:0 14px}
.schedule-row .time{font-size:18px;font-weight:800}

/* 出席狀況 25% */
.attendance{grid-template-columns:150px 1fr 230px;padding:14px 18px}
.attendance .title{font-size:25px}
.attendance .stat{padding:10px 6px}
.attendance .stat span{font-size:14px}
.attendance .stat strong{font-size:31px}
.attendance .absent-list{font-size:16px;padding:12px 13px}

/* 導師叮嚀 15%：刪除小熊 */
.reminder{padding:8px 18px;grid-template-columns:170px 1fr}
.reminder:before,.reminder:after{content:none!important;display:none!important}
.reminder .title{font-size:21px}
.reminder ul{font-size:14px;line-height:1.28}

/* 座位表 60% */
.seat-card{padding:9px 18px 12px}
.seat-head{margin-bottom:3px}
.seat-head .title{font-size:21px}
.board{width:82%;padding:8px 6px;margin:0 auto 7px;font-size:15px;letter-spacing:12px}
.seats{height:calc(100% - 73px);gap:6px}
.seat{font-size:27px;font-weight:900}


/* ===== 大螢幕重新平衡版 ===== */

/* 左右改為 48 / 52，右側資訊較多，取得稍多空間 */
.dashboard{grid-template-columns:48% 52%;gap:14px}

/* 左上：移除目前狀態，讓時間成為真正主角 */
.clock-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 22px}
.clock{font-size:78px;line-height:1;margin:10px 0 8px}
.date{font-size:22px}
.count-label{font-size:20px}
.countdown{font-size:38px;margin-top:5px}
.current{display:none}

/* 左側上下比例稍微平衡 */
.left{grid-template-rows:290px 1fr}

/* 右側仍為 25 / 15 / 60 */
.right{grid-template-rows:25% 15% 60%}

/* 出席狀況：三個統計框明顯放大 */
.attendance{
  grid-template-columns:145px 1fr 225px;
  gap:16px;
  padding:15px 20px;
}
.attendance .title{font-size:25px}
.attendance .stats{gap:12px}
.attendance .stat{
  min-height:94px;
  padding:11px 7px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border-radius:15px;
}
.attendance .stat span{font-size:15px;margin-bottom:3px}
.attendance .stat strong{font-size:34px;line-height:1}
.attendance .absent-list{
  min-height:58px;
  display:flex;
  align-items:center;
  font-size:16px;
  border-radius:14px;
}

/* 考程維持大字，但稍微增加左右呼吸空間 */
.schedule{padding:16px 22px}
.schedule-row{grid-template-columns:185px 1fr;font-size:23px;min-height:55px}
.schedule-row .time{font-size:18px}

/* 右側座位表因欄寬增加，座位略放大 */
.seat{font-size:28px}


/* ===== 圈選區域精修 ===== */

/* 1. 出席統計四個資訊框放大 */
.attendance{
  grid-template-columns:140px 1fr 255px;
  gap:17px;
  padding:13px 20px;
}
.attendance .stats{gap:13px}
.attendance .stat{
  min-height:112px;
  padding:13px 8px;
  border-radius:16px;
}
.attendance .stat span{
  font-size:17px;
  font-weight:800;
  margin-bottom:5px;
}
.attendance .stat strong{
  font-size:39px;
  font-weight:900;
}
.attendance .absent-list{
  min-height:72px;
  padding:13px 16px;
  font-size:18px;
  font-weight:850;
  border-radius:16px;
}
.attendance .absent-list b{font-size:20px}

/* 2. 導師叮嚀內容放大，仍維持一點一行 */
.reminder{
  grid-template-columns:170px 1fr;
  padding:8px 20px;
}
.reminder .title{font-size:22px}
.reminder ul{
  font-size:17px;
  line-height:1.35;
  gap:2px;
  padding-left:22px;
}

/* 3. 黑板精準對齊最上排四個座位的總寬度
   六欄座位中，上排使用中間四欄，因此黑板寬度 = 4/6 座位區寬度 */
.board{
  width:66.6667%;
  padding:8px 6px;
  margin:0 auto 7px;
}


/* ===== 導師叮嚀與座位間距微調 ===== */

/* 導師叮嚀：三行 21px */
.reminder ul{
  font-size:21px;
  line-height:1.22;
  gap:0;
}

/* 座位格縮小，字體維持 28px；增加格子之間的留白 */
.seats{
  height:calc(100% - 73px);
  gap:12px 14px;
  padding:5px 10px 8px;
}
.seat{
  font-size:28px;
  font-weight:900;
  width:88%;
  height:82%;
  min-height:0;
  justify-self:center;
  align-self:center;
}

/* 黑板仍對齊第一排四個座位縮小後的視覺寬度 */
.board{
  width:59%;
}


/* ===== 出席狀況自動保存 ===== */
.attendance{
  grid-template-columns:140px 1fr 255px auto;
}
.reset-attendance{
  appearance:none;
  border:1px solid #d8cfc4;
  background:#fffdfa;
  color:#6d6761;
  border-radius:12px;
  padding:10px 12px;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.reset-attendance:hover{
  background:#f1ece5;
  color:#302f2d;
}


/* ===== 三日考程自動切換 ===== */
.schedule-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.schedule-heading .title{margin-bottom:12px}
.day-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:68px;
  padding:6px 11px;
  margin-bottom:12px;
  border-radius:999px;
  background:var(--orange-soft);
  color:#c85e37;
  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
}


/* ===== 右上資訊區舒展版 ===== */

/* 出席區：避免四個資訊框互相擠壓 */
.attendance{
  grid-template-columns:150px 1fr;
  grid-template-rows:auto auto;
  column-gap:18px;
  row-gap:10px;
  padding:14px 20px;
}
.attendance .title{
  grid-row:1 / 3;
  align-self:center;
}
.attendance .stats{
  grid-column:2;
  grid-row:1;
  grid-template-columns:repeat(3,minmax(105px,1fr));
  gap:14px;
}
.attendance .stat{
  min-height:88px;
  padding:10px 12px;
}
.attendance .absent-list{
  grid-column:2;
  grid-row:2;
  min-height:48px;
  width:100%;
  padding:9px 15px;
}
.reset-attendance{
  position:absolute;
  right:20px;
  bottom:14px;
  padding:7px 11px;
  font-size:12px;
}
.attendance{position:relative}
.attendance .absent-list{padding-right:105px}

/* 導師叮嚀：稍微縮字並增加行距，不再擠成一團 */
.reminder{
  grid-template-columns:170px 1fr;
  padding:10px 20px;
}
.reminder ul{
  font-size:19px;
  line-height:1.45;
  gap:2px;
}


/* ===== 右側溢出修正版 ===== */

/* 關鍵：Grid 子項允許真正縮小，不再把右欄撐出 viewport */
.dashboard,.right,.top-right,.attendance,.reminder,.seat-card{min-width:0}
.attendance>*,
.reminder>*,
.seat-card>*{min-width:0}

/* 出席區重新用固定可控欄寬，全部收在右欄內 */
.attendance{
  grid-template-columns:140px minmax(0,1fr);
  grid-template-rows:auto auto;
  column-gap:14px;
  row-gap:8px;
  padding:12px 18px;
  overflow:hidden;
}
.attendance .stats{
  width:100%;
  min-width:0;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.attendance .stat{
  width:auto;
  min-width:0;
  min-height:82px;
  padding:8px 5px;
}
.attendance .stat span{font-size:14px;white-space:nowrap}
.attendance .stat strong{font-size:32px}
.attendance .absent-list{
  box-sizing:border-box;
  width:100%;
  min-width:0;
  min-height:46px;
  padding:8px 100px 8px 13px;
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.reset-attendance{
  right:18px;
  bottom:13px;
  max-width:86px;
}

/* 叮嚀文字避免寬度把右欄撐開 */
.reminder{
  grid-template-columns:150px minmax(0,1fr);
  overflow:hidden;
}
.reminder ul{
  min-width:0;
  font-size:18px;
  line-height:1.42;
}
.reminder li{white-space:normal}

/* 座位區也禁止內容撐破右欄 */
.seat-card{overflow:hidden}
.seats{min-width:0}
.seat{min-width:0}


/* ===== 最終視覺微調：右側標題一致＋考科重點色 ===== */

/* 三個右側區塊標題統一 */
.attendance .title,
.reminder .title,
.seat-card .title,
.seat-title,
.seat-card h2,
.seat-card h3{
  font-size:25px !important;
  font-weight:700 !important;
  line-height:1.25 !important;
  letter-spacing:0 !important;
}

/* 座位表標題與黑板／座位之間增加垂直間距 */
.seat-card .title,
.seat-title,
.seat-card h2,
.seat-card h3{
  margin-bottom:18px !important;
}

/* 正式考科：暖橘色、稍加粗；非考科維持原本灰黑 */
.schedule .exam-subject{
  color:#b65f35 !important;
  font-weight:800 !important;
}

</style>
</head>
<body>
<header><h1>鼓山高中504｜第一次段考</h1><div class="tag">504 Exam Dashboard</div></header>
<main class="dashboard">
  <section class="left">
    <div class="card clock-card">
      <div class="date" id="date">日期</div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="count-label" id="countLabel">準備今天的考試</div>
      <div class="countdown" id="countdown">--:--</div>
      <div class="current" id="current">目前狀態：準備中</div>
    </div>
    <div class="card schedule">
      <div class="schedule-heading"><h2 class="title">✎ 今日考程</h2><span class="day-badge" id="dayBadge">—</span></div>
      <div id="schedule"></div>
    </div>
  </section>

  <section class="right">
    <div class="top-right">
      <div class="card attendance">
        <h2 class="title">出席狀況</h2>
        <div class="stats">
          <div class="stat"><span>應到</span><strong>27</strong></div>
          <div class="stat"><span>實到</span><strong id="presentCount">27</strong></div>
          <div class="stat"><span>缺席</span><strong id="absentCount">0</strong></div>
        </div>
        <div class="absent-list">缺席座號：<b id="absentNumbers">—</b></div><button class="reset-attendance" onclick="resetAttendance()" title="將出席狀況恢復為全班到班">重設出席</button>
      </div>
      <div class="card reminder">
        <h2 class="title">導師叮嚀</h2>
        <ul>
          <li>鐘響前請收妥課本與個人物品</li>
          <li>記得寫上班級、姓名與座號</li>
          <li>考試結束請立即停筆</li>
        </ul>
      </div>
    </div>

    <div class="card seat-card">
      <div class="seat-head">
        <h2 class="title">504 座位表｜學生視角</h2>
        <div class="legend">點一下：缺席｜再點一下：恢復到班</div>
      </div>
      <div class="board">黑 板</div>
      <div class="seats" id="seats"></div>
    </div>
  </section>
</main>

<script>
const TOTAL_STUDENTS=27;
const examSchedules={
 "2026-10-12":{
   day:"DAY 1",
   schedule:[
     ["08:10","09:10","國寫"],
     ["09:30","10:30","自修"],
     ["10:50","11:50","歷史"],
     ["11:50","12:30","午餐、打掃"],
     ["13:30","14:30","自修"],
     ["14:50","15:50","國文"]
   ]
 },
 "2026-10-13":{
   day:"DAY 2",
   schedule:[
     ["08:10","09:10","自修"],
     ["09:30","10:30","英聽"],
     ["10:50","11:50","地理"],
     ["11:50","12:30","午餐、打掃"],
     ["13:30","14:30","自修"],
     ["14:50","15:50","數學B"]
   ]
 },
 "2026-10-14":{
   day:"DAY 3",
   schedule:[
     ["08:10","09:10","公民"],
     ["09:30","10:30","自修"],
     ["10:50","11:50","自修"],
     ["11:50","12:30","午餐、打掃"],
     ["13:30","14:30","自修"],
     ["14:50","15:50","英文"]
   ]
 }
};

function localDateKey(d){
  const previewDay = new URLSearchParams(window.location.search).get("day");
  const previewDates = {
    "1":"2026-10-12",
    "2":"2026-10-13",
    "3":"2026-10-14"
  };
  if(previewDates[previewDay]) return previewDates[previewDay];

  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function getTodayExam(){
  const key=localDateKey(new Date());
  return examSchedules[key] || null;
}
let todayExam=getTodayExam();
let schedule=todayExam ? todayExam.schedule : [];
const seatLayout=[
 [null,19,22,9,15,null],
 [25,14,7,18,2,23],
 [5,12,6,8,1,16],
 [21,20,4,17,13,11],
 [null,3,10,24,27,26]
];
const STORAGE_KEY="504-exam-absent-seats";
let savedAbsent=[];
try{
  savedAbsent=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(!Array.isArray(savedAbsent)) savedAbsent=[];
}catch(e){savedAbsent=[];}
const absent=new Set(savedAbsent.map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=TOTAL_STUDENTS));

function saveAttendance(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify([...absent].sort((a,b)=>a-b)));
}
function resetAttendance(){
  if(!confirm("確定要將出席狀況重設為全班到班嗎？")) return;
  absent.clear();
  saveAttendance();
  renderSeats();
  updateAttendance();
}

function mins(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function renderSchedule(active=-1){
 const box=document.getElementById("schedule"); box.innerHTML="";
 const badge=document.getElementById("dayBadge");
 if(!todayExam){
   badge.textContent="非考試日";
   const d=document.createElement("div");
   d.className="schedule-row";
   d.innerHTML='<span class="time">—</span><span>今日無定期評量考程</span>';
   box.appendChild(d);
   return;
 }
 badge.textContent=todayExam.day;
 schedule.forEach((r,i)=>{
   const d=document.createElement("div");d.className="schedule-row"+(i===active?" active":"");
   d.innerHTML=`<span class="time">${r[0]} – ${r[1]}</span><span>${r[2]}</span>`;box.appendChild(d);
 });
}
function renderSeats(){
 const box=document.getElementById("seats");box.innerHTML="";
 seatLayout.flat().forEach(n=>{
   const d=document.createElement("div");
   if(n===null){d.className="seat empty";}
   else{
     d.className="seat"+(absent.has(n)?" absent":"");
     d.textContent=n;
     d.onclick=()=>{absent.has(n)?absent.delete(n):absent.add(n);saveAttendance();renderSeats();updateAttendance();}
   }
   box.appendChild(d);
 });
}
function updateAttendance(){
 const nums=[...absent].sort((a,b)=>a-b);
 document.getElementById("presentCount").textContent=TOTAL_STUDENTS-nums.length;
 document.getElementById("absentCount").textContent=nums.length;
 document.getElementById("absentNumbers").textContent=nums.length?nums.join("、"):"—";
}
function updateClock(){
 const now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds(), cur=h*60+m;
 const days=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
 document.getElementById("date").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
 document.getElementById("clock").textContent=[h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
 todayExam=getTodayExam();
 schedule=todayExam ? todayExam.schedule : [];
 let active=-1,next=-1;
 schedule.forEach((r,i)=>{if(cur>=mins(r[0])&&cur<mins(r[1]))active=i;if(next<0&&cur<mins(r[0]))next=i;});
 renderSchedule(active);
 let label,current,target;
 if(!todayExam){
   document.getElementById("countLabel").textContent="今日非定期評量日";
   document.getElementById("current").textContent="";
   document.getElementById("countdown").textContent="—";
   return;
 }
 if(active>=0){label=`【${schedule[active][2]}】結束倒數`;current=`目前狀態：${schedule[active][2]}`;target=mins(schedule[active][1])*60;}
 else if(next>=0){label=`【${schedule[next][2]}】開始倒數`;current=`目前狀態：等待 ${schedule[next][2]}`;target=mins(schedule[next][0])*60;}
 else{label="今日考程已結束";current="目前狀態：考程結束";target=null;}
 document.getElementById("countLabel").textContent=label;document.getElementById("current").textContent=current;
 if(target===null)document.getElementById("countdown").textContent="完成";
 else{let diff=Math.max(0,target-(h*3600+m*60+s));document.getElementById("countdown").textContent=`${String(Math.floor(diff/60)).padStart(2,"0")}:${String(diff%60).padStart(2,"0")}`;}
}
renderSeats();updateAttendance();updateClock();setInterval(updateClock,1000);
</script>

<script>
/* 考程正式考科重點色：自修、午餐打掃等生活時段不套色 */
(function(){
  const nonExam = new Set(["自修","午餐、打掃","午餐打掃","午餐","打掃"]);
  function markExamSubjects(){
    document.querySelectorAll(".schedule .subject").forEach(el=>{
      const text=(el.textContent||"").trim();
      el.classList.toggle("exam-subject", text && !nonExam.has(text));
    });
  }
  const observer=new MutationObserver(markExamSubjects);
  window.addEventListener("DOMContentLoaded",()=>{
    markExamSubjects();
    const schedule=document.querySelector(".schedule");
    if(schedule) observer.observe(schedule,{childList:true,subtree:true,characterData:true});
  });
})();
</script>
