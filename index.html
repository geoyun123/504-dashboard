<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼓山高中504｜定期評量儀表板</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #f2efe9;
  --card: #faf9f6;
  --line: #ddd8d0;
  --text: #343230;
  --muted: #716c66;
  --dark: #403e3b;
  --orange: #d9784c;
  --orange-soft: #f3e1d6;
  --seat: #f7f5f1;
  --absent: #ead6d1;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
               "Microsoft JhengHei", sans-serif;
}

header {
  height: 52px;
  padding: 0 22px;
  background: var(--dark);
  color: #faf8f3;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
  letter-spacing: .5px;
}

.header-tag {
  border: 1px solid #77736d;
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 13px;
  color: #eeeae3;
}

.dashboard {
  height: calc(100vh - 52px);
  padding: 12px 16px;
  display: grid;
 grid-template-columns: 1fr 1fr;
  gap: 12px;
  overflow: hidden;
}

.left {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.right {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(40,38,35,.04);
  padding: 14px 16px;
}

.date {
  text-align: center;
  font-size: 20px;
  color: #67635f;
}

.clock {
  text-align: center;
  font-size: 54px;
  line-height: 1.05;
  font-weight: 750;
  letter-spacing: 1px;
  color: #292826;
  margin: 6px 0 4px;
  font-variant-numeric: tabular-nums;
}

.countdown-title {
  text-align: center;
  color: #625e59;
  font-size: 17px;
  font-weight: 600;
}

.countdown {
  text-align: center;
  font-size: 31px;
  line-height: 1.1;
  font-weight: 750;
  color: var(--orange);
  margin-top: 4px;
}

.status {
  margin-top: 9px;
  text-align: center;
  background: #ebe7e0;
  padding: 8px;
  border-radius: 12px;
  color: #45413d;
  font-size: 16px;
  font-weight: 650;
}

.attendance-title,
.reminder-title,
.seat-title {
  font-size: 20px;
  font-weight: 750;
  margin-bottom: 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.stat {
  background: #ebe7e0;
  padding: 9px 3px;
  border-radius: 11px;
  text-align: center;
}

.stat span {
  display: block;
  font-size: 14px;
  color: var(--muted);
}

.stat strong {
  display: block;
  font-size: 24px;
  margin-top: 2px;
}

.reminder {
  background: #ece8e0;
}

.reminder ul {
  margin: 0;
  padding-left: 22px;
  font-size: 16px;
  line-height: 1.55;
}

.schedule-card {
  padding: 12px 16px 8px;
}

.schedule-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.schedule-heading h2 {
  margin: 0;
  font-size: 20px;
}

.day-label {
  color: #a95636;
  background: #eee9e1;
  padding: 5px 10px;
  border-radius: 14px;
  font-size: 13px;
}

.schedule-row {
  display: grid;
  grid-template-columns: 150px minmax(120px, 220px) 1fr;
  align-items: center;
  min-height: 39px;
  padding: 4px 12px;
  border-bottom: 1px solid #e4dfd8;
  border-left: 4px solid transparent;
}

.schedule-row:last-child { border-bottom: 0; }

.schedule-row .time {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 14px;
  font-weight: 650;
  color: #484541;
}

.schedule-row .subject {
  font-size: 17px;
  font-weight: 700;
  color: #44413e;
}

.schedule-row .note {
  font-size: 12px;
  color: #8d8781;
}

.schedule-row.active {
  background: var(--orange-soft);
  border-left-color: var(--orange);
  border-radius: 8px;
}

.schedule-row.active .subject { color: #b95731; }

.seat-card {
  padding: 11px 16px 8px;
}

.seat-title {
  margin-bottom: 4px;
}

.board {
  width: 30%;
  min-width: 180px;
  margin: 0 auto 7px;
  padding: 4px;
  text-align: center;
  border-radius: 7px;
  background: #55524e;
  color: white;
  letter-spacing: 6px;
  font-size: 10px;
}

.seats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px 7px;
}

.seat {
  min-height: 34px;
  padding: 3px 2px;
  border: 1px solid #dcd7cf;
  background: var(--seat);
  border-radius: 7px;
  text-align: center;
  cursor: pointer;
  user-select: none;
}

.seat .num {
  font-size: 13px;
  line-height: 1.05;
  font-weight: 750;
}

.seat-status {
  margin-top: 1px;
  font-size: 9px;
  color: #999;
}

.seat.absent {
  background: var(--absent);
  border-color: #c98c7d;
}

.seat.absent .seat-status {
  color: #a94f3f;
  font-weight: 700;
}

.seat-help {
  margin-top: 5px;
  text-align: center;
  color: #77726c;
  font-size: 10px;
}

@media (max-width: 900px) {
  .dashboard {
    height: auto;
    overflow: visible;
    grid-template-columns: 1fr;
  }

  .schedule-row {
    grid-template-columns: 125px 1fr;
  }

  .schedule-row .note { display: none; }

  .seats {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-height: 760px) and (min-width: 901px) {
  .dashboard { padding-top: 8px; }
  .left, .right { gap: 7px; }
  .card { padding-top: 10px; padding-bottom: 10px; }
  .clock { font-size: 47px; }
  .date { font-size: 18px; }
  .reminder ul { line-height: 1.4; font-size: 15px; }
  .schedule-row { min-height: 35px; padding-top: 2px; padding-bottom: 2px; }
  .seat { min-height: 30px; padding: 2px; }
}
</style>
</head>

<body>
<header>
  <h1>鼓山高中 504｜第一次定期評量</h1>
  <div class="header-tag">🌻 504 Exam Dashboard</div>
</header>

<main class="dashboard">
  <section class="left">
    <div class="card">
      <div class="date" id="date">日期</div>
      <div class="clock" id="clock">00:00:00</div>
      <div class="countdown-title" id="countdownTitle">今日考程</div>
      <div class="countdown" id="countdown">--:--</div>
      <div class="status" id="status">🌻 準備今天的考試</div>
    </div>

    <div class="card">
      <div class="attendance-title">📋 504 出缺席</div>
      <div class="stats">
        <div class="stat"><span>應到</span><strong id="totalCount">27</strong></div>
        <div class="stat"><span>實到</span><strong id="presentCount">27</strong></div>
        <div class="stat"><span>未到</span><strong id="absentCount">0</strong></div>
      </div>
    </div>

    <div class="card reminder">
      <div class="reminder-title">💌 導師小叮嚀</div>
      <ul>
        <li>鐘響前請收妥課本與個人物品</li>
        <li>記得寫上班級、姓名與座號</li>
        <li>考試結束請立即停筆</li>
      </ul>
    </div>
  </section>

  <section class="right">
    <div class="card schedule-card">
      <div class="schedule-heading">
        <h2>🌻 今日考程</h2>
        <div class="day-label">第 1 天考程</div>
      </div>
      <div id="schedule"></div>
    </div>

    <div class="card seat-card">
      <div class="seat-title">🪑 504 座位表</div>
      <div class="board">黑 板</div>
      <div class="seats" id="seats"></div>
      <div class="seat-help">點一下：缺席 ｜ 再點一下：恢復到班</div>
    </div>
  </section>
</main>

<script>
const schedule = [
  { start: "08:10", end: "09:00", subject: "國文", note: "" },
  { start: "09:15", end: "10:05", subject: "英文", note: "" },
  { start: "10:20", end: "11:10", subject: "數學", note: "" },
  { start: "11:10", end: "12:30", subject: "午餐、打掃", note: "" },
  { start: "12:30", end: "13:10", subject: "午休", note: "" },
  { start: "13:20", end: "14:10", subject: "歷史", note: "" },
  { start: "14:25", end: "15:15", subject: "地理", note: "" }
];

function buildSchedule() {
  const box = document.getElementById("schedule");
  box.innerHTML = "";

  schedule.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "schedule-row";
    row.id = "schedule-" + index;
    row.innerHTML = `
      <div class="time">${item.start} - ${item.end}</div>
      <div class="subject">${item.subject}</div>
      <div class="note">${item.note}</div>
    `;
    box.appendChild(row);
  });
}

function timeToToday(time, now) {
  const [hour, minute] = time.split(":").map(Number);
  const d = new Date(now);
  d.setHours(hour, minute, 0, 0);
  return d;
}

function formatCountdown(ms) {
  if (ms < 0) ms = 0;
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  if (hours > 0) {
    return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
  }
  return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

function updateClock() {
  const now = new Date();
  const weekdays = ["日","一","二","三","四","五","六"];

  document.getElementById("date").textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("zh-TW", { hour12: false });

  document.querySelectorAll(".schedule-row")
    .forEach(row => row.classList.remove("active"));

  let current = -1;
  let next = -1;

  for (let i = 0; i < schedule.length; i++) {
    const start = timeToToday(schedule[i].start, now);
    const end = timeToToday(schedule[i].end, now);

    if (now >= start && now < end) {
      current = i;
      break;
    }
    if (now < start) {
      next = i;
      break;
    }
  }

  const title = document.getElementById("countdownTitle");
  const countdown = document.getElementById("countdown");
  const status = document.getElementById("status");

  if (current >= 0) {
    const item = schedule[current];
    document.getElementById("schedule-" + current).classList.add("active");
    const end = timeToToday(item.end, now);
    title.textContent = `【${item.subject}】結束倒數`;
    countdown.textContent = formatCountdown(end - now);
    status.textContent = `🌻 目前狀態：${item.subject}`;
  } else if (next >= 0) {
    const item = schedule[next];
    const start = timeToToday(item.start, now);
    title.textContent = `距離【${item.subject}】開始`;
    countdown.textContent = formatCountdown(start - now);
    status.textContent = "☕ 現在是休息時間";
  } else {
    title.textContent = "今日考程";
    countdown.textContent = "完成";
    status.textContent = "🎉 今天的考程結束了";
  }
}

const TOTAL_STUDENTS = 27;
const seatStates = {};

function buildSeats() {
  const box = document.getElementById("seats");
  box.innerHTML = "";

  for (let i = 1; i <= TOTAL_STUDENTS; i++) {
    seatStates[i] = 0;
    const seat = document.createElement("div");
    seat.className = "seat";
    seat.id = "seat-" + i;
    seat.innerHTML = `
      <div class="num">${i}</div>
      <div class="seat-status">到班</div>
    `;
    seat.addEventListener("click", () => changeSeat(i));
    box.appendChild(seat);
  }
}

function changeSeat(number) {
  seatStates[number] = (seatStates[number] + 1) % 2;

  const seat = document.getElementById("seat-" + number);
  const text = seat.querySelector(".seat-status");

  seat.classList.remove("absent");

  if (seatStates[number] === 0) {
    text.textContent = "到班";
  } else {
    seat.classList.add("absent");
    text.textContent = "缺席";
  }

  updateAttendance();
}

function updateAttendance() {
  let absent = 0;
  Object.values(seatStates).forEach(state => {
    if (state === 1) absent++;
  });

  const present = TOTAL_STUDENTS - absent;

  document.getElementById("totalCount").textContent = TOTAL_STUDENTS;
  document.getElementById("presentCount").textContent = present;
  document.getElementById("absentCount").textContent = absent;
}

buildSchedule();
buildSeats();
updateAttendance();
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
